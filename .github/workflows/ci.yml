name: Vérification GeoInsight AI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances des tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest shapely pandas streamlit folium streamlit-folium pyproj requests
      - name: Vérifier la syntaxe et les tests
        run: |
          python -m compileall -q app etl tests
          python -m pytest -q tests/test_geo_shapes.py tests/test_name_matching.py tests/test_quartier_bi.py tests/test_quebec_mask.py tests/test_regional_bi.py tests/test_socioeconomic.py tests/test_regional_charts.py
